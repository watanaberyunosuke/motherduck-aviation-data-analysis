name: ci-cd

# test:   every push and pull request. Unit tests plus a full dbt build on a temporary
#         DuckDB file (tests/test_dbt_models.py).
# deploy: pushes to main (or a manual run on main), after tests pass. Builds the dbt
#         project into MotherDuck so model and seed changes go live before the next
#         scheduled ingest, then publishes the aviation_pipeline Flight (pinned to this
#         commit) and the Airport conditions Dive (scripts/deploy_motherduck.py), then
#         runs the Flight once (METAR + dbt) and fails if that run fails.
#         dbt, the Flight and the Dive each only run when the push changed their files
#         (see "Detect changes"); a manual run does all three.
# Required secrets (repository or `production` environment): MOTHERDUCK_TOKEN,
# OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET (copied into the Flight's `opensky` secret).
# Optional: FAA_CLIENT_ID, FAA_CLIENT_SECRET (the Flight's `faa` secret, for FAA NOTAMs),
# AERODATABOX_KEY (the Flight's `aerodatabox` secret, for AeroDataBox fallback flights).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented setup; 3.14 matches the local uv environment.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Same group as ingest.yml: one writer at a time against the warehouse.
    concurrency:
      group: warehouse-writer
      cancel-in-progress: false
    env:
      WAREHOUSE: md:aviation
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, to diff against the commit before this push
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      # Diffs the whole push (github.event.before..GITHUB_SHA), so re-running a failed
      # deploy retries the same changes. pyproject.toml / uv.lock pin the dbt version
      # CI builds with. The Flight downloads its pinned commit and runs src/, dbt/ and
      # config/ from it, so those count as Flight changes: skipping them would leave the
      # Flight rebuilding the previous models. Manual runs, new branches and force
      # pushes (no usable `before`) run everything.
      - name: Detect changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          dbt_paths="dbt pyproject.toml uv.lock"
          flight_paths="flights/aviation_pipeline src/aviation dbt config scripts/deploy_motherduck.py"
          dive_paths="dives/airport_conditions scripts/deploy_motherduck.py"
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no previous commit to compare against; running everything"
            dbt=true; flight=true; dive=true
          else
            dbt=false; flight=false; dive=false
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- $dbt_paths || dbt=true
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- $flight_paths || flight=true
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- $dive_paths || dive=true
          fi
          echo "dbt changed: $dbt, flight changed: $flight, dive changed: $dive"
          echo "dbt=$dbt" >> "$GITHUB_OUTPUT"
          echo "flight=$flight" >> "$GITHUB_OUTPUT"
          echo "dive=$dive" >> "$GITHUB_OUTPUT"

      - name: Check MotherDuck token
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "::error::MOTHERDUCK_TOKEN secret is not set"
            exit 1
          fi

      - name: Create MotherDuck database if missing
        run: |
          uv run python -c "
          import duckdb, os
          db = os.environ['WAREHOUSE'].removeprefix('md:')
          duckdb.connect('md:').execute(f'create database if not exists {db}')
          "

      # Seeds are small reference tables. Recreating them lets a seed gain or lose
      # columns without a manual --full-refresh against production.
      - name: dbt seed (full refresh)
        if: steps.changes.outputs.dbt == 'true'
        working-directory: dbt
        run: uv run dbt seed --full-refresh --profiles-dir .

      - name: dbt build
        if: steps.changes.outputs.dbt == 'true'
        working-directory: dbt
        run: uv run dbt build --profiles-dir .

      # Points the Flight at this commit (and refreshes its secrets), then
      # publishes the Dive. Runs after dbt so the Dive never queries a mart that isn't built.
      - name: Publish MotherDuck Flight and Dive
        if: steps.changes.outputs.flight == 'true' || steps.changes.outputs.dive == 'true'
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          FLIGHT: ${{ steps.changes.outputs.flight }}
          DIVE: ${{ steps.changes.outputs.dive }}
        run: |
          only=()
          if [ "$FLIGHT" = true ]; then only+=(--only flight); fi
          if [ "$DIVE" = true ]; then only+=(--only dive); fi
          uv run python scripts/deploy_motherduck.py --sha "$GITHUB_SHA" "${only[@]}"

      # Smoke test the published Flight: one METAR ingest then dbt build, in the Flight
      # runtime. Catches failures that only show up there (e.g. ingest and dbt sharing a
      # process) on the push that causes them, not at the next manual run. Skipped with a
      # warning if the plan's daily Flight minutes are spent (exit 75): the Flight is
      # already published, and the next manual Flight run tests it.
      - name: Run Flight once
        if: steps.changes.outputs.flight == 'true'
        run: |
          status=0
          uv run python scripts/run_flight.py --sources metar || status=$?
          if [ "$status" = 75 ]; then
            echo "::warning::Flight smoke test skipped: today's Flight minutes are spent (reset at 00:00 UTC)"
            exit 0
          fi
          exit $status
