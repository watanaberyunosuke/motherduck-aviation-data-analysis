name: ingest

# GitHub runners are ephemeral, so scheduled runs write to MotherDuck (WAREHOUSE=md:aviation).
# Required repository secrets:
#   MOTHERDUCK_TOKEN, OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET
#
# Schedules are UTC and deliberately off the hour (GitHub delays jobs queued at :00).
on:
  schedule:
    - cron: "7 * * * *"      # hourly: METAR + TAF
    - cron: "22 */3 * * *"   # every 3 h: Hong Kong NOTAMs (free, official)
    - cron: "47 6 * * *"     # daily 06:47 UTC: OpenSky flights + tracks for yesterday
  workflow_dispatch:
    inputs:
      source:
        description: "Source to ingest"
        type: choice
        options: [metar, taf, notam-hk, opensky, all]
        default: all

# One writer at a time against the warehouse (shared with the deploy job in ci.yml).
concurrency:
  group: warehouse-writer
  cancel-in-progress: false

env:
  WAREHOUSE: md:aviation
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
  OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Pick sources for this trigger
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "7 * * * *")    echo "sources=metar taf" >> "$GITHUB_OUTPUT" ;;
            "22 */3 * * *") echo "sources=notam-hk" >> "$GITHUB_OUTPUT" ;;
            "47 6 * * *")   echo "sources=opensky" >> "$GITHUB_OUTPUT" ;;
            *)              echo "sources=${{ inputs.source || 'all' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Ingest
        run: |
          status=0
          for s in ${{ steps.pick.outputs.sources }}; do
            uv run aviation ingest "$s" || status=1
          done
          exit $status

      # Rebuild marts even if one source failed, so the others still land.
      - name: dbt build
        if: always()
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
