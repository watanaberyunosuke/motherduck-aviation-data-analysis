name: ingest

# Twice-daily trigger (00:00 and 12:00 UTC) for the MotherDuck Flight `aviation_pipeline`
# (flights/aviation_pipeline/main.py, deployed by the ci.yml deploy job). MotherDuck only
# schedules Flights on paid plans and this account is on the free plan, so this cron starts
# each run with md_run_flight (scripts/run_flight.py) and waits for it; a failed Flight run
# fails this workflow.
# Each run loads METARs and TAFs for the last weather.lookback_hours (26, so a dropped
# run leaves no gap) and HK and FAA NOTAM Search NOTAMs, then runs dbt build.
#
# Flights run every hour on the hour on the GitHub runner, not in the Flight: `aviation
# backfill flights` fetches each (airport, direction, UTC day) of the last 30 days not yet
# loaded (OpenSky, then AeroDataBox for days OpenSky missed if its key is set), newest
# first, plus tracks for the newest day, then dbt build. Loaded days are skipped, so most
# runs only add tracks; a new day is loaded once it is complete (06 UTC, after OpenSky's
# nightly batch). This keeps the slowest step out of the plan's daily Flight minutes, and
# OpenSky has timed out from the Flight's servers but not from GitHub's.
#
# Manual runs can pick sources, and `runner: github` runs ingest + dbt on the GitHub
# runner instead, as a fallback if the Flight is unavailable. If the plan's daily Flight
# minutes are spent (run_flight.py exits 75), the flight job hands the same run to the
# github job automatically. backfill-weather / backfill-flights load history: on the Flight
# runner through the `initial_load` Flight, on the GitHub runner with `aviation backfill`.
# Required repository secrets: MOTHERDUCK_TOKEN (and OPENSKY_CLIENT_ID /
# OPENSKY_CLIENT_SECRET, and optionally FAA_CLIENT_ID / FAA_CLIENT_SECRET and
# AERODATABOX_KEY, for the github runner; the Flight uses its own `opensky`, `faa` and
# `aerodatabox` secrets).
on:
  schedule:
    - cron: "0 0,12 * * *"  # UTC: the Flight
    - cron: "0 * * * *"     # hourly flights on the GitHub runner (see above)
  workflow_dispatch:
    inputs:
      source:
        description: "Sources to ingest (scheduled = the Flight's plan: weather + NOTAMs)"
        type: choice
        options: [scheduled, metar, taf, notam-hk, notam-faa-search, opensky, aerodatabox, all, none,
                  backfill-weather, backfill-flights]
        default: scheduled
      runner:
        description: "Where to run"
        type: choice
        options: [flight, github]
        default: flight

# One writer at a time with the deploy job in ci.yml. The trigger waits for the Flight,
# so the group covers Flight runs too.
concurrency:
  group: warehouse-writer
  cancel-in-progress: false

env:
  WAREHOUSE: md:aviation
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

jobs:
  flight:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 0,12 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.runner == 'flight')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(inputs.source, 'backfill-') && 65 || 30 }}
    outputs:
      quota_spent: ${{ steps.run.outputs.quota_spent }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Run Flight and wait
        id: run
        env:
          SOURCE: ${{ inputs.source || 'scheduled' }}
        run: |
          case "$SOURCE" in
            backfill-*)
              args=(--flight initial_load --config "STEPS=${SOURCE#backfill-}" --timeout-minutes 60) ;;
            scheduled) args=(--sources "") ;;
            all)    args=(--sources "metar taf notam-hk notam-faa-search opensky aerodatabox") ;;
            *)      args=(--sources "$SOURCE") ;;
          esac
          status=0
          uv run python scripts/run_flight.py "${args[@]}" || status=$?
          if [ "$status" = 75 ]; then
            echo "::warning::Today's Flight minutes are spent (reset at 00:00 UTC); running on the GitHub runner instead"
            echo "quota_spent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $status

  github:
    # needs + !cancelled(): runs after a skipped flight job (hourly, or runner: github) and
    # after a flight job that found the Flight minutes spent.
    needs: flight
    if: >-
      !cancelled() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 * * * *')
        || (github.event_name == 'workflow_dispatch' && inputs.runner == 'github')
        || needs.flight.outputs.quota_spent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || startsWith(inputs.source, 'backfill-')) && 60 || 30 }}
    env:
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
      FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
      AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Ingest
        if: inputs.source != 'none'
        env:
          # Schedules have no inputs: hourly is flights, twice-daily (a Flight fallback)
          # is the Flight's plan.
          SOURCE: ${{ github.event.schedule == '0 * * * *' && 'backfill-flights' || inputs.source || 'scheduled' }}
        run: |
          # Same plan as the Flight's PLAN.
          [ "$SOURCE" = scheduled ] && SOURCE="metar taf notam-hk notam-faa-search"
          case "$SOURCE" in
            # As the initial_load Flight: OpenSky gets the day's credits (the floor stops it).
            backfill-weather) exec uv run aviation backfill weather ;;
            backfill-flights) exec uv run aviation backfill flights --opensky-calls 1000 ;;
          esac
          status=0
          for s in $SOURCE; do
            uv run aviation ingest "$s" || status=1
          done
          exit $status

      # Rebuild marts even if one source failed, so the others still land.
      - name: dbt build
        if: always()
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
