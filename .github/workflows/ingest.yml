name: ingest

# Manual fallback only. Scheduled ingest runs as the MotherDuck Flight `aviation_pipeline`
# (flights/aviation_pipeline/main.py), deployed by the ci.yml deploy job. Use this when
# the Flight is unavailable, or to re-run a source from GitHub.
#
# GitHub runners are ephemeral, so this writes to MotherDuck (WAREHOUSE=md:aviation).
# Required repository secrets:
#   MOTHERDUCK_TOKEN, OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to ingest"
        type: choice
        options: [metar, taf, notam-hk, opensky, all]
        default: all

# One writer at a time with the deploy job in ci.yml. This does not cover the Flight,
# which runs at :07 each hour; avoid starting this around then.
concurrency:
  group: warehouse-writer
  cancel-in-progress: false

env:
  WAREHOUSE: md:aviation
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
  OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Ingest
        env:
          SOURCE: ${{ inputs.source }}
        run: uv run aviation ingest "$SOURCE"

      # Rebuild marts even if one source failed, so the others still land.
      - name: dbt build
        if: always()
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
