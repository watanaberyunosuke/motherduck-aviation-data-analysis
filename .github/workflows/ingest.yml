name: ingest

# Hourly ingest on the GitHub runner, at 17 minutes past (GitHub delays and drops more
# runs on the hour). Each run loads, in one job and before a single dbt build:
# - weather and NOTAMs, the plan of the MotherDuck Flight `aviation_pipeline`: METARs and
#   TAFs for the last weather.lookback_hours (26, so delayed or dropped runs leave no gap)
#   and HK and FAA NOTAM Search NOTAMs;
# - flights: `aviation backfill flights` fetches each (airport, direction, UTC day) of the
#   last 30 days not yet loaded (OpenSky, then AeroDataBox for days OpenSky missed if its
#   key is set), newest first, plus tracks for the newest day. Loaded days are skipped,
#   so most runs only add tracks; a new day is loaded once it is complete (06 UTC, after
#   OpenSky's nightly batch). OpenSky has timed out from the Flight's servers but not
#   from GitHub's.
# The schedule does not use the Flight: once the marts grew, its dbt build took up to
# half an hour, more than the free plan's 30 daily Flight minutes, and a separate weather
# run would add a second dbt build each hour to the plan's compute.
#
# Manual runs can pick sources and run them in the Flight (`runner: flight`, started with
# md_run_flight by scripts/run_flight.py, which waits for it; a failed Flight run fails
# this workflow) or on the GitHub runner (`runner: github`). If the plan's daily Flight
# minutes are spent (run_flight.py exits 75), the flight job hands the same run to the
# github job automatically. backfill-weather / backfill-flights load history: on the Flight
# runner through the `initial_load` Flight, on the GitHub runner with `aviation backfill`.
# Required repository secrets: MOTHERDUCK_TOKEN (and OPENSKY_CLIENT_ID /
# OPENSKY_CLIENT_SECRET, and optionally FAA_CLIENT_ID / FAA_CLIENT_SECRET and
# AERODATABOX_KEY, for the github runner; the Flight uses its own `opensky`, `faa` and
# `aerodatabox` secrets).
on:
  schedule:
    - cron: "17 * * * *"  # hourly on the GitHub runner (see above)
  workflow_dispatch:
    inputs:
      source:
        description: "Sources to ingest (scheduled = weather + NOTAMs, the Flight's plan)"
        type: choice
        options: [scheduled, metar, taf, notam-hk, notam-faa-search, opensky, aerodatabox, all, none,
                  backfill-weather, backfill-flights]
        default: scheduled
      runner:
        description: "Where to run"
        type: choice
        options: [flight, github]
        default: flight

# One writer at a time with the deploy job in ci.yml. The trigger waits for the Flight,
# so the group covers Flight runs too.
concurrency:
  group: warehouse-writer
  cancel-in-progress: false

env:
  WAREHOUSE: md:aviation
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

jobs:
  flight:
    if: github.event_name == 'workflow_dispatch' && inputs.runner == 'flight'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(inputs.source, 'backfill-') && 65 || 30 }}
    outputs:
      quota_spent: ${{ steps.run.outputs.quota_spent }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Run Flight and wait
        id: run
        env:
          SOURCE: ${{ inputs.source || 'scheduled' }}
        run: |
          case "$SOURCE" in
            backfill-*)
              args=(--flight initial_load --config "STEPS=${SOURCE#backfill-}" --timeout-minutes 60) ;;
            scheduled) args=(--sources "") ;;
            all)    args=(--sources "metar taf notam-hk notam-faa-search opensky aerodatabox") ;;
            *)      args=(--sources "$SOURCE") ;;
          esac
          status=0
          uv run python scripts/run_flight.py "${args[@]}" || status=$?
          if [ "$status" = 75 ]; then
            echo "::warning::Today's Flight minutes are spent (reset at 00:00 UTC); running on the GitHub runner instead"
            echo "quota_spent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $status

  github:
    # needs + !cancelled(): runs after a skipped flight job (hourly, or runner: github) and
    # after a flight job that found the Flight minutes spent.
    needs: flight
    if: >-
      !cancelled() && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.runner == 'github')
        || needs.flight.outputs.quota_spent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || startsWith(inputs.source, 'backfill-')) && 60 || 30 }}
    env:
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
      FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
      AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Ingest
        if: inputs.source != 'none'
        env:
          # Schedules have no inputs: the hourly run is weather, NOTAMs and flights.
          SOURCE: ${{ github.event_name == 'schedule' && 'hourly' || inputs.source || 'scheduled' }}
        run: |
          # Same plan as the Flight's PLAN.
          plan="metar taf notam-hk notam-faa-search"
          flights=false
          case "$SOURCE" in
            # As the initial_load Flight: OpenSky gets the day's credits (the floor stops it).
            backfill-weather) exec uv run aviation backfill weather ;;
            backfill-flights) exec uv run aviation backfill flights --opensky-calls 1000 ;;
            hourly) SOURCE="$plan"; flights=true ;;
            scheduled) SOURCE="$plan" ;;
          esac
          # Weather and NOTAMs first: they take a minute, flights can take much longer.
          status=0
          for s in $SOURCE; do
            uv run aviation ingest "$s" || status=1
          done
          if [ "$flights" = true ]; then
            uv run aviation backfill flights --opensky-calls 1000 || status=1
          fi
          exit $status

      # Rebuild marts even if one source failed, so the others still land.
      - name: dbt build
        if: always()
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
