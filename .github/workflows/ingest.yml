name: ingest

# Twice-daily trigger (00:07 and 12:07 UTC) for the MotherDuck Flight `aviation_pipeline`
# (flights/aviation_pipeline/main.py, deployed by the ci.yml deploy job). MotherDuck only
# schedules Flights on a Business plan, so this cron starts each run with md_run_flight
# (scripts/run_flight.py) and waits for it; a failed Flight run fails this workflow.
# Each run loads METARs and TAFs for the last weather.lookback_hours (26, so a dropped
# run leaves no gap) and HK and FAA NOTAM Search NOTAMs, then runs dbt build.
#
# Flights run every hour at :17 on the GitHub runner, not in the Flight: `aviation
# backfill flights` fetches each (airport, direction, UTC day) of the last 30 days not yet
# loaded (AeroDataBox if its key is set, then OpenSky), newest first, plus tracks for the
# newest day, then dbt build. Loaded days are skipped, so most runs only add tracks; a
# new day is loaded once it is complete (06 UTC, after OpenSky's nightly batch). This
# keeps the slowest step out of the plan's daily Flight minutes, and OpenSky has timed
# out from the Flight's servers but not from GitHub's.
#
# Manual runs can pick sources, and `runner: github` runs ingest + dbt on the GitHub
# runner instead, as a fallback if the Flight is unavailable (or the plan's daily Flight
# minutes are spent). backfill-weather / backfill-flights load history: on the Flight
# runner through the `initial_load` Flight, on the GitHub runner with `aviation backfill`.
# Required repository secrets: MOTHERDUCK_TOKEN (and OPENSKY_CLIENT_ID /
# OPENSKY_CLIENT_SECRET, and optionally FAA_CLIENT_ID / FAA_CLIENT_SECRET and
# AERODATABOX_KEY, for the github runner; the Flight uses its own `opensky`, `faa` and
# `aerodatabox` secrets).
on:
  schedule:
    - cron: "7 */12 * * *"  # UTC, off the hour (GitHub delays jobs queued at :00): the Flight
    - cron: "17 * * * *"    # hourly flights on the GitHub runner (see above)
  workflow_dispatch:
    inputs:
      source:
        description: "Sources to ingest (scheduled = the Flight's plan: weather + NOTAMs)"
        type: choice
        options: [scheduled, metar, taf, notam-hk, notam-faa-search, aerodatabox, opensky, all, none,
                  backfill-weather, backfill-flights]
        default: scheduled
      runner:
        description: "Where to run"
        type: choice
        options: [flight, github]
        default: flight

# One writer at a time with the deploy job in ci.yml. The trigger waits for the Flight,
# so the group covers Flight runs too.
concurrency:
  group: warehouse-writer
  cancel-in-progress: false

env:
  WAREHOUSE: md:aviation
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

jobs:
  flight:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 */12 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.runner == 'flight')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(inputs.source, 'backfill-') && 65 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Run Flight and wait
        env:
          SOURCE: ${{ inputs.source || 'scheduled' }}
        run: |
          case "$SOURCE" in
            backfill-*)
              uv run python scripts/run_flight.py --flight initial_load \
                --config "STEPS=${SOURCE#backfill-}" --timeout-minutes 60
              exit ;;
            scheduled) sources="" ;;
            all)    sources="metar taf notam-hk notam-faa-search aerodatabox opensky" ;;
            *)      sources="$SOURCE" ;;
          esac
          uv run python scripts/run_flight.py --sources "$sources"

  github:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 * * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.runner == 'github')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || startsWith(inputs.source, 'backfill-')) && 60 || 30 }}
    env:
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
      FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
      AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Ingest
        if: inputs.source != 'none'
        env:
          # The hourly flights schedule has no inputs.
          SOURCE: ${{ github.event_name == 'schedule' && 'backfill-flights' || inputs.source }}
        run: |
          # Same plan as the Flight's PLAN.
          [ "$SOURCE" = scheduled ] && SOURCE="metar taf notam-hk notam-faa-search"
          case "$SOURCE" in
            # As the initial_load Flight: OpenSky gets the day's credits (the floor stops it).
            backfill-weather) exec uv run aviation backfill weather ;;
            backfill-flights) exec uv run aviation backfill flights --opensky-calls 1000 ;;
          esac
          status=0
          for s in $SOURCE; do
            uv run aviation ingest "$s" || status=1
          done
          exit $status

      # Rebuild marts even if one source failed, so the others still land.
      - name: dbt build
        if: always()
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
