name: dependabot-auto-merge

# Turns on auto-merge (squash) for Dependabot's minor and patch updates (see
# .github/dependabot.yml). GitHub merges once main's required checks pass: ci-cd's
# "test (3.11)" and "test (3.14)" and the Vercel preview. Major updates are left open
# for review.
# Merges made with GITHUB_TOKEN do not trigger other workflows, so ci-cd's deploy job does
# not run for them. The hourly ingest picks up uv.lock changes on its next run; the Flights
# pick up their requirements.txt at the next deploy that publishes them.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.repository == 'watanaberyunosuke/groundkit-dashboard'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
