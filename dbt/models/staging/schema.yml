version: 2

models:
  - name: stg_flights
    description: >
      One row per flight from the preferred source for its (airport, direction, UTC day)
      slot: OpenSky where it has loaded flights for that slot, else AeroDataBox.
    columns:
      - name: flight_id
        tests: [not_null, unique]
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['aerodatabox', 'opensky']

  - name: stg_hkia_flights
    description: Hong Kong's flight boards with each flight's gate time (off-block or on-block).
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [direction, flight, scheduled_at]
    columns:
      - name: direction
        tests:
          - accepted_values:
              arguments:
                values: ['departure', 'arrival']

  - name: stg_aerodatabox_flights
    description: One row per AeroDataBox flight, both boards merged, including cancellations.
    columns:
      - name: flight_id
        tests: [not_null, unique]
