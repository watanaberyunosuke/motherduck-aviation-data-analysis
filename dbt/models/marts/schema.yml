version: 2

models:
  - name: fct_airport_weather_hourly
    description: Latest METAR per airport per UTC hour.
    columns:
      - name: icao
        tests: [not_null]
      - name: iata
        tests: [not_null]
      - name: hour_utc
        tests: [not_null]
      - name: flight_category
        tests:
          - accepted_values:
              arguments:
                values: ['VFR', 'MVFR', 'IFR', 'LIFR']
              config:
                where: "flight_category is not null"
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [icao, hour_utc]

  - name: fct_notams
    description: NOTAMs from all sources with category and in-force flags.
    columns:
      - name: notam_key
        tests: [not_null]
      - name: starts_at
        description: Null only when the provider's text could not be parsed.
      - name: category
        description: From the Q-code subject (letters 2-3); null when there is no ICAO Q-line.
      - name: location_iata
        description: IATA code of the NOTAM location; null for FIRs and airports without one.
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [source, notam_key]

  - name: fct_daily_airport_movements
    description: >
      Arrivals and departures per airport per UTC day: AeroDataBox boards (cancellations
      excluded) where loaded, otherwise OpenSky's observed ADS-B movements.
    columns:
      - name: iata
        tests: [not_null]
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [icao, day_utc]

  - name: fct_flight_track_metrics
    description: Path length, route inefficiency and terminal-area time per tracked flight.
    columns:
      - name: path_km
        tests:
          - not_null
      - name: route_inefficiency
        description: Flown distance / great-circle distance. Values below ~0.95 indicate missing coverage.
      - name: has_arrival_coverage
        description: >
          Track seen outside the destination's terminal area before entering it and within
          30 km of the runway at the end. Enough to trust terminal_minutes from any origin.
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [icao24, track_start_epoch]

  - name: fct_arrival_weather_impact
    description: >
      Well-covered arrivals with weather, NOTAM state and excess terminal-area time versus
      the destination's rolling median. Primary table for the dashboard.
    columns:
      - name: terminal_minutes
        tests: [not_null]
      - name: arrival_iata
        tests: [not_null]
      - name: has_notam_feed
        description: >
          False when the arrival landed before its airport's NOTAM source first loaded,
          or the airport has no NOTAM source (currently the Australian airports).
        tests: [not_null]
      - name: surface_notam_in_force
        description: Null when has_notam_feed is false (unknown, not "none in force").
      - name: runway_closure_in_force
        description: Null when has_notam_feed is false (unknown, not "none in force").

  - name: fct_arrivals
    description: >
      Every arrival at an in-scope airport, from any origin, with the latest METAR flight
      category: from AeroDataBox (with schedule) where loaded, else OpenSky. Terminal
      metrics only where fct_arrival_weather_impact has the flight.
    columns:
      - name: flight_id
        description: Source-specific key. AeroDataBox number@scheduled departure; OpenSky icao24@first seen.
        tests: [not_null, unique]
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['aerodatabox', 'opensky']
      - name: scheduled_at
        description: Scheduled arrival (AeroDataBox only).
      - name: delay_minutes
        description: >
          arrived_at minus scheduled_at. Null for OpenSky (no schedule) and where
          AeroDataBox has no actual time (arrival_time_is_scheduled).
      - name: callsign
        description: ICAO form as broadcast, e.g. QFA627.
      - name: flight_number_iata
        description: >
          IATA form, e.g. QF627. Null when the callsign is not an airline designator plus
          number, or the airline is not in the airlines seed.
      - name: arrival_iata
        tests: [not_null]
      - name: flight_category
        description: Null when no METAR within metar_max_age_minutes before arrival.

  - name: fct_departures
    description: >
      Every observed departure from an in-scope airport, to any destination, with the METAR
      flight category at take-off and, where a well-covered track exists, time to leave
      the departure terminal area against the airport's rolling 30-day median.
    columns:
      - name: flight_id
        tests: [not_null, unique]
      - name: delay_minutes
        description: >
          departed_at minus scheduled_at. Null for OpenSky (no schedule) and where
          AeroDataBox has no actual time (departure_time_is_scheduled).
      - name: departure_iata
        tests: [not_null]
      - name: departure_terminal_minutes
        description: First airborne point to first point outside the terminal radius. Null without a well-covered track.
      - name: excess_departure_minutes
        description: departure_terminal_minutes minus the airport's rolling median (excluding the flight itself).

  - name: fct_airport_conditions
    description: One row per in-scope airport with its time zone and the latest METAR, TAF and NOTAM count.
    columns:
      - name: icao
        tests: [not_null, unique]
      - name: timezone
        tests: [not_null]
      - name: notams_in_force
        description: Null where the airport has no NOTAM feed (unknown, not zero).

  - name: fct_terminal_tracks
    description: >
      Track points within map_radius_km of an in-scope airport, one per 30 s per track, for
      the arrival end of flights landing there and the departure end of flights leaving it.
    columns:
      - name: role
        tests:
          - accepted_values:
              arguments:
                values: ['arrival', 'departure']
