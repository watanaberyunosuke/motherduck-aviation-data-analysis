# Airports in scope. `notam_source` decides which NOTAM client serves each airport:
#   hk_cad   -> Hong Kong CAD public feed (free, official, no key)
#   faa_search -> FAA NOTAM Search website (free, no key; the site's own backend, see
#               notam_faa_search.py). US NOTAMs plus international NOTAMs the FAA receives
#               through the ICAO exchange.
#   faa      -> FAA NOTAM API (free, needs FAA_CLIENT_ID / FAA_CLIENT_SECRET from api.faa.gov).
#               Same data through the official API; the fallback if faa_search stops working.
#   rapidapi -> SkyLink NOTAM API on RapidAPI (paid; no free tier. Basic: $18.59/mo, 5,000 requests)
#   null     -> no NOTAM feed. NOTAM flags in the marts are null (unknown) for these airports.
# Australia has no free official NOTAM feed, so it is null for now. Its NOTAMs should also
# reach the FAA; switch them to faa_search once a spot-check against Airservices NAIPS
# shows the FAA copy is complete. Keep `notam_source` in dbt/seeds/airports.csv in step.
# `weather_gov` names the national weather service wx_extra.py asks first for temperature
# (and dew point, weather text where it has them) when the METAR is missing or stale:
#   hko -> Hong Kong Observatory open data   nea -> Singapore NEA (data.gov.sg)
#   nws -> US National Weather Service       null -> straight to Open-Meteo, then MET Norway
# Australia is null: the Bureau of Meteorology's terms bar passing its data on. The
# Netherlands is null: KNMI serves NetCDF files behind a key, not worth the parser yet.
# Coordinates live in dbt/seeds/airports.csv so SQL models can use them.
airports:
  - icao: YSSY
    name: Sydney Kingsford Smith
    notam_source: null
  - icao: YMML
    name: Melbourne Tullamarine
    notam_source: null
  - icao: YBBN
    name: Brisbane
    notam_source: null
  - icao: WSSS
    name: Singapore Changi
    notam_source: faa_search
    weather_gov: nea
  - icao: VHHH
    name: Hong Kong International
    notam_source: hk_cad
    weather_gov: hko
  - icao: EHAM
    name: Amsterdam Schiphol
    notam_source: faa_search
  - icao: PANC
    name: Anchorage Ted Stevens
    notam_source: faa_search
    weather_gov: nws

# Flights: OpenSky first (free, and it alone supplies flight paths); AeroDataBox (paid, with
# schedules) only for airport-days OpenSky returned no flights for, or, in a run where
# OpenSky fails, every day it has not loaded. Both load the newest complete day and then
# older ones, newest first, back to `backfill_days`. Every run fetches only the (airport,
# direction, day) slots not yet loaded, so the hourly GitHub run (ingest.yml, `aviation
# backfill flights`) spends credits and units only on gaps: a new day once a day, and older
# days until the 30-day window is full.
aerodatabox:
  # Marketplace the AERODATABOX_KEY belongs to: rapidapi | apimarket. Without a key the
  # source is skipped and OpenSky covers everything.
  provider: rapidapi
  days_back: 1
  # Days of flight history kept loaded. Plans reach back about a year at most.
  backfill_days: 30
  # Each call is a TIER 2 call (2 units on RapidAPI) covering 12 h; a day for all seven
  # airports is 14 calls. As a fallback it is usually called far less: only for days
  # OpenSky missed. If OpenSky were down for good, filling 30 days would be about 420
  # calls and each new day 14 (about 420 a month). This caps one run's calls.
  max_backfill_calls_per_run: 140

weather:
  # The scheduled run fetches weather every hour (ingest.yml), but GitHub's cron delays
  # and drops runs (gaps of 5-8 h seen), so each METAR and TAF fetch covers this many
  # hours.
  lookback_hours: 26
  # History loaded by `aviation backfill weather`: 30 days, all the Aviation Weather Center
  # serves. (More than 30 would take older METARs from the IEM archive.)
  backfill_days: 30

opensky:
  # Flights endpoints are batch-processed overnight by OpenSky, so pull whole UTC days
  # that have already finished. 1 = yesterday.
  days_back: 1
  # Days of flight history kept loaded, including slots AeroDataBox has. Each airport-day
  # costs 30 flights credits of about 4,000 a day, so filling 30 days for seven airports
  # (420 calls) takes about four days; after that each new day is 14 calls.
  backfill_days: 30
  # Calls per run. The credit floor (min_credits_remaining) usually stops it first.
  max_backfill_calls_per_run: 1000
  # Track only flights arriving at an airport in the list above, from any origin. Those
  # are the arrivals the terminal-time baseline is built for.
  track_arrivals_only: true
  # Hard cap on /tracks calls per run, independent of the API's own quota. Each call
  # costs several tracks credits (4-30 seen), not one, so keep this modest.
  max_tracks_per_run: 100
  # Stop calling OpenSky when X-Rate-Limit-Remaining falls below this.
  min_credits_remaining: 200

rapidapi:
  # Unused while no airport has notam_source: rapidapi. SkyLink has no free tier. Basic ($18.59/mo) includes 5,000 requests, then $0.007 each.
  # 4 airports x 4 runs/day x 30 days = 480 calls/month. Documentation only; not enforced in code.
  monthly_request_budget: 5000
