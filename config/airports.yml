# Airports in scope. `notam_source` decides which NOTAM client serves each airport:
#   hk_cad   -> Hong Kong CAD public feed (free, official, no key)
#   faa_search -> FAA NOTAM Search website (free, no key; the site's own backend, see
#               notam_faa_search.py). US NOTAMs plus international NOTAMs the FAA receives
#               through the ICAO exchange.
#   faa      -> FAA NOTAM API (free, needs FAA_CLIENT_ID / FAA_CLIENT_SECRET from api.faa.gov).
#               Same data through the official API; the fallback if faa_search stops working.
#   rapidapi -> SkyLink NOTAM API on RapidAPI (paid; no free tier. Basic: $18.59/mo, 5,000 requests)
#   null     -> no NOTAM feed. NOTAM flags in the marts are null (unknown) for these airports.
# Australia has no free official NOTAM feed, so it is null for now. Its NOTAMs should also
# reach the FAA; switch them to faa_search once a spot-check against Airservices NAIPS
# shows the FAA copy is complete. Keep `notam_source` in dbt/seeds/airports.csv in step.
# Coordinates live in dbt/seeds/airports.csv so SQL models can use them.
airports:
  - icao: YSSY
    name: Sydney Kingsford Smith
    notam_source: null
  - icao: YMML
    name: Melbourne Tullamarine
    notam_source: null
  - icao: YBBN
    name: Brisbane
    notam_source: null
  - icao: WSSS
    name: Singapore Changi
    notam_source: faa_search
  - icao: VHHH
    name: Hong Kong International
    notam_source: hk_cad
  - icao: EHAM
    name: Amsterdam Schiphol
    notam_source: faa_search
  - icao: PANC
    name: Anchorage Ted Stevens
    notam_source: faa_search

# Flights: AeroDataBox first (it has schedules), OpenSky for every (airport, direction,
# UTC day) AeroDataBox has not loaded. Both backfill older days a little each daily run,
# newest first, back to `backfill_days`; OpenSky alone also supplies flight paths.
aerodatabox:
  # Marketplace the AERODATABOX_KEY belongs to: rapidapi | apimarket. Without a key the
  # source is skipped and OpenSky covers everything.
  provider: rapidapi
  days_back: 1
  # Plans reach back about a year at most; do not set this beyond the plan's history.
  backfill_days: 365
  # Each call is a TIER 2 call (2 units on RapidAPI) covering 12 h; a full day for all
  # seven airports is 14 calls. The daily fetch alone is about 420 calls a month, so set
  # this to what is left of the plan's monthly units / 2 / 30.
  max_backfill_calls_per_run: 40

weather:
  # METAR history loaded by `aviation backfill weather`: the Aviation Weather Center for
  # the last 30 days (all it serves), the IEM archive before that. TAFs: 30 days only.
  backfill_days: 1095

opensky:
  # Flights endpoints are batch-processed overnight by OpenSky, so pull whole UTC days
  # that have already finished. 1 = yesterday.
  days_back: 1
  # Older days to backfill, newest first, skipping slots AeroDataBox has. Each
  # airport-day costs 30 flights credits of about 4,000 a day, so a year for seven
  # airports takes about seven weeks of daily runs.
  backfill_days: 365
  # Backfill calls per run, about what the daily credits leave after yesterday's 14 calls,
  # so the Flight run stays short.
  max_backfill_calls_per_run: 110
  # Track only flights arriving at an airport in the list above, from any origin. Those
  # are the arrivals the terminal-time baseline is built for.
  track_arrivals_only: true
  # Hard cap on /tracks calls per run, independent of the API's own quota. Each call
  # costs several tracks credits (4-30 seen), not one, so keep this modest.
  max_tracks_per_run: 100
  # Stop calling OpenSky when X-Rate-Limit-Remaining falls below this.
  min_credits_remaining: 200

rapidapi:
  # Unused while no airport has notam_source: rapidapi. SkyLink has no free tier. Basic ($18.59/mo) includes 5,000 requests, then $0.007 each.
  # 4 airports x 4 runs/day x 30 days = 480 calls/month. Documentation only; not enforced in code.
  monthly_request_budget: 5000
